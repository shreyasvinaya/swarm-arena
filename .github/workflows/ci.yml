name: CI

on:
  push:
    # Every branch of this repository is tested on push, so its pull request
    # does not need a second run (see the job conditions below).
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  actions: read  # pr-verify reads the push run of the PR head

# A newer push to the same branch (or a new commit on the same PR) cancels the older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Test jobs run disjoint duration-balanced groups of the suite (pytest-split).
  # Separate worker processes overlap I/O waits inside each shard.
  core:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # No extras: proves that the core imports and passes with no optional dependency.
    # No ty: ty checks every import, and the extra-only modules import optional packages.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Branch pushes test the oldest and newest Python; main also covers 3.12.
        python-version: ${{ github.ref == 'refs/heads/main' && fromJSON('["3.11", "3.12", "3.13"]') || fromJSON('["3.11", "3.13"]') }}
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - if: matrix.shard == 1
        run: uv run ruff check .
      - if: matrix.shard == 1
        run: uv run ruff format --check .
      - run: cp .test_durations test-durations.json
      - run: uv run pytest -n 4 --dist worksteal --durations=25 --store-durations --clean-durations --durations-path test-durations.json --splits 3 --group ${{ matrix.shard }} --splitting-algorithm least_duration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durations-core-${{ matrix.python-version || '3.11' }}-${{ matrix.shard }}
          path: test-durations.json

  extras:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --all-groups
      - if: matrix.shard == 1
        run: uv run ty check
      - run: cp .test_durations test-durations.json
      - run: uv run pytest -n 4 --dist worksteal --durations=25 --store-durations --clean-durations --durations-path test-durations.json --splits 3 --group ${{ matrix.shard }} --splitting-algorithm least_duration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durations-extras-${{ matrix.python-version || '3.11' }}-${{ matrix.shard }}
          path: test-durations.json
      - if: matrix.shard == 1
        run: uv run pytest -m s3 -v

  docs:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"
      - run: uv sync --locked --all-extras --group docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  lowest-direct:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"
      - run: uv sync --all-groups --resolution lowest-direct --upgrade
      - run: cp .test_durations test-durations.json
      - run: uv run --no-sync pytest -q -n 4 --dist worksteal --durations=25 --store-durations --clean-durations --durations-path test-durations.json --splits 3 --group ${{ matrix.shard }} --splitting-algorithm least_duration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durations-lowest-direct-${{ matrix.python-version || '3.11' }}-${{ matrix.shard }}
          path: test-durations.json

  macos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Branch pushes test macOS on the newest Python; main also covers the oldest.
        python-version: ${{ github.ref == 'refs/heads/main' && fromJSON('["3.11", "3.13"]') || fromJSON('["3.13"]') }}
        # Four branch shards fill the 20-job budget; main stays below five macOS jobs.
        shard: ${{ github.ref == 'refs/heads/main' && fromJSON('[1, 2]') || fromJSON('[1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - run: cp .test_durations test-durations.json
      - run: uv run pytest -q -n 3 --dist worksteal --durations=25 --store-durations --clean-durations --durations-path test-durations.json --splits ${{ github.ref == 'refs/heads/main' && 2 || 4 }} --group ${{ matrix.shard }} --splitting-algorithm least_duration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durations-macos-${{ matrix.python-version || '3.11' }}-${{ matrix.shard }}
          path: test-durations.json

  pr-verify:
    # Same-repository PRs reuse the push run of their head commit instead of running
    # every job twice. Fail closed unless that push run completed successfully.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wait for the push run of the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 110); do
            state=$(gh run list -R "$REPO" --workflow CI --event push --commit "$SHA" \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)
            echo "push run for $SHA: ${state:-none}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) exit 1 ;;
            esac
            sleep 60
          done
          echo "no completed push run for $SHA"
          exit 1
