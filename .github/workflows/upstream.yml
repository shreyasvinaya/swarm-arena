name: upstream
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  newest-llm-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[llm,cache,langfuse]" --group dev --override upstream-overrides.txt
      - run: uv pip show openai-agents litellm
      - run: .venv/bin/python tests/test_ci_config.py --record-upstream upstream-installed.json
      - run: .venv/bin/python -m pytest tests/llm -v
        env:
          SWARM_ARENA_UPSTREAM_CANARY: upstream-installed.json
